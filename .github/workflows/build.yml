# Builds and tests the library on macOS, Windows and Linux, then assembles one zip with
# every native binary. On a tag "v*" the zip is attached to a GitHub release.
name: build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# the release step needs to write to the repository (create the release and attach the zip)
permissions:
  contents: write

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest    # Apple Silicon runner; builds the universal dylib
            variant: macos
          - os: windows-latest
            variant: windows-amd64
          - os: ubuntu-22.04
            variant: linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java and tests
        shell: bash
        run: SKIP_NATIVE=1 ./build.sh

      # ---------------------------------------------------------------- macOS / Linux
      - name: Build native bridge and mock (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          native/build_native.sh "$PWD/native/build"
          native/mock/build_mock.sh

      - name: Run tests (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/run_tests.sh

      # ---------------------------------------------------------------- Windows
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native bridge and mock (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call native\build_native.bat %CD%\native\build || exit /b 1
          call native\mock\build_mock.bat || exit /b 1

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\run_tests.bat

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.variant }}
          path: |
            native/build/macos-aarch64
            native/build/macos-x86_64
            native/build/windows-amd64
            native/build/linux-amd64
          if-no-files-found: error

  package:
    name: package library
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native/build
          merge-multiple: true

      - name: Assemble the library zip
        shell: bash
        run: |
          ls -R native/build
          SKIP_NATIVE=1 ./build.sh
          cp dist/LeapMotionForProcessing.zip "LeapMotionForProcessing-$(sed -n 's/^prettyVersion=//p' library.properties).zip"
          ls -la *.zip

      - name: Upload library zip
        uses: actions/upload-artifact@v4
        with:
          name: LeapMotionForProcessing
          path: LeapMotionForProcessing-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LeapMotionForProcessing-*.zip
          generate_release_notes: true
