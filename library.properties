sentence=Use the Leap Motion Controller in Processing 4 on macOS (Apple Silicon and Intel) through the Ultraleap Gemini/Hyperion tracking service.
paragraph=Fork of "Leap Motion for Processing" v2.3.1.6 by Darius Morawiec. The original V2 native libraries (Intel only) were replaced by a LeapC based re-implementation of the com.leapmotion.leap API with a native JNI bridge for arm64/x86_64. Gestures (swipe, circle, key tap, screen tap) are recognised in Java. Requires the Ultraleap Hand Tracking software (Hyperion 6.x) installed and running.
